specVersion: 0.0.4
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: LoggingContract
    network: sepolia
    source:
      address: "0x4f9F964d706c13c2d74Aba15560c71FA8D54c51e"
      abi: LoggingContract
      startBlock: 9065322
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Session
        - Log
        - LogSummary
        - ToolCall
      abis:
        - name: LoggingContract
          file: LoggingContract/abis/LoggingContract.json
      eventHandlers:
        - event: LogsUploaded(indexed string,(string,string,(string,string,string)[])[],string)
          handler: handleLogsUploaded
      file: LoggingContract/LoggingContract.wasm
